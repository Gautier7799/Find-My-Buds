name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Name APK with version
        run: |
          VERSION="0.3.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Find-My-Buds-v${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload versioned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Find-My-Buds-v0.3.${{ github.run_number }}-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/Find-My-Buds-v0.3.${{ github.run_number }}-build-${{ github.run_number }}.apk
